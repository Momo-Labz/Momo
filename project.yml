name: BarBoy
options:
  bundleIdPrefix: com.momolabz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: BAR BOY
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  BarBoy:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momolabz.barboy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BAR BOY
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: BAR BOY uses your local network only when you enable Desk Display, so your paired screen can read live session status from this Mac.
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Momo Labz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - BarBoyTests
  BarBoyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: BarBoy
    settings:
      base:
        PRODUCT_NAME: BarBoyTests
        PRODUCT_MODULE_NAME: BarBoyTests
        PRODUCT_BUNDLE_IDENTIFIER: com.momolabz.barboy.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BAR BOY.app/Contents/MacOS/BAR BOY"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
